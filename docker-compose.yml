services:
  db:
    image: postgres:16-alpine
    container_name: toktickit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: toktickit
      POSTGRES_PASSWORD: toktickit
      POSTGRES_DB: toktickit
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toktickit -d toktickit"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: toktickit-server
    environment:
      DATABASE_URL: postgresql://toktickit:toktickit@db:5432/toktickit?schema=public
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: toktickit-client
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules

volumes:
  postgres_data: